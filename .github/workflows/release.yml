# Builds the Marrow VSCode extension as a self-contained, per-platform .vsix.
#
# For each supported VSCode target the matrix:
#   1. builds the marrow-lsp and marrow-dap release binaries for that platform's
#      Rust target triple (native, or cross-compiled where noted),
#   2. bundles them into editors/vscode/server/,
#   3. runs `vsce package --target <vscode-target>` to produce one .vsix,
#   4. uploads that .vsix as a build artifact.
#
# On a version tag (v*), a final job downloads every .vsix and attaches them to a
# GitHub Release. This workflow deliberately does NOT publish to the Marketplace —
# that requires the maintainer's VSCE_PAT and is run manually.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release on a tag

jobs:
  package:
    name: package ${{ matrix.vscode_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon — native on the arm64 runner.
          - vscode_target: darwin-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            cross: false
          # macOS Intel — cross-compiled from the arm64 runner (both targets ship
          # with the Xcode toolchain, no extra linker needed).
          - vscode_target: darwin-x64
            os: macos-14
            rust_target: x86_64-apple-darwin
            cross: false
          # Linux x64 — native on the ubuntu runner.
          - vscode_target: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            cross: false
          # Linux arm64 — cross-compiled from the x64 ubuntu runner via `cross`,
          # which supplies the aarch64 linker/sysroot in a container.
          - vscode_target: linux-arm64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            cross: true
          # Windows x64 — native on the windows runner.
          - vscode_target: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v4

      # --- Rust toolchain + the target triple for this matrix entry ---
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      # --- Build the release binaries for this target ---
      # `cross` for linux-arm64 (containerized cross linker); plain cargo elsewhere.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build binaries (cross)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.rust_target }} \
            -p marrow-lsp -p marrow-dap

      - name: Build binaries (cargo)
        if: ${{ !matrix.cross }}
        run: |
          cargo build --release --target ${{ matrix.rust_target }} \
            -p marrow-lsp -p marrow-dap

      # --- Node toolchain for the extension build + packaging ---
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Compile extension (minified)
        working-directory: editors/vscode
        run: npm run compile:release

      # Bundle the just-built binaries into editors/vscode/server/. The bundle
      # script reads from target/<triple>/release/ when CARGO_BUILD_TARGET is set.
      - name: Bundle binaries
        working-directory: editors/vscode
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
        # The Rust steps already built; the script's `cargo build` is then a no-op.
        run: npm run bundle

      - name: Package .vsix
        working-directory: editors/vscode
        run: npx @vscode/vsce package --no-dependencies --target ${{ matrix.vscode_target }}

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: marrow-${{ matrix.vscode_target }}
          path: editors/vscode/*.vsix
          if-no-files-found: error

  # --- Attach every .vsix to a GitHub Release on a version tag ---
  release:
    name: github release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all .vsix artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
