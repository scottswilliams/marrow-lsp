[package]
name = "marrow-lsp"
description = "Language Server for the Marrow .mw language, over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "marrow-lsp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
marrow-lsp-core = { path = "../marrow-lsp-core" }
marrow-terminal.workspace = true
lsp-types.workspace = true
tower-lsp.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync", "time"] }
serde_json = "1"

[dev-dependencies]
# `test-util` enables tokio's paused virtual clock for the deterministic
# non-blocking harness; it stays test-only so the shipped binary never links it.
tokio = { version = "1", features = ["test-util"] }
marrow-check = { workspace = true, features = ["test-support"] }
marrow-project.workspace = true
marrow-run.workspace = true
marrow-store.workspace = true
serde_json = "1"
tempfile = "3"
url = "2"
