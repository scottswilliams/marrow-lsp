[workspace]
resolver = "2"
members = [
    "crates/marrow-lsp-core",
    "crates/marrow-lsp",
    "crates/marrow-mcp",
    "crates/marrow-dap",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/scottswilliams/marrow-lsp"
authors = ["Marrow contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

# The canonical marrow crates. Path dependencies during local development; switch
# to a single pinned git revision once marrow is published so every crate moves
# together and the analysis surface cannot drift between commits.
[workspace.dependencies]
marrow-syntax = { path = "../marrow/crates/marrow-syntax" }
marrow-check = { path = "../marrow/crates/marrow-check" }
marrow-json = { path = "../marrow/crates/marrow-json" }
marrow-schema = { path = "../marrow/crates/marrow-schema" }
marrow-store = { path = "../marrow/crates/marrow-store", features = ["native"] }
marrow-run = { path = "../marrow/crates/marrow-run" }
marrow-project = { path = "../marrow/crates/marrow-project" }

# The LSP wire types. Pinned to the exact version tower-lsp 0.20 re-exports so the
# server and the core link one lsp-types and exchange the same `Diagnostic`, `Url`,
# and `Position` without a conversion layer. Bump in lockstep with tower-lsp.
lsp-types = "=0.94.1"
tower-lsp = "0.20"

# The extension launches this binary on every editor session, so the shipped build
# is optimized for fast startup and fast responses (dev builds use `dev`). `strip`
# keeps the binary small to load; panics stay unwinding so a faulty request cannot
# abort the whole server.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
